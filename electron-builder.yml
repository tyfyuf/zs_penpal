appId: com.penpal.app
productName: Penpal
icon: build/icon.ico
afterPack: scripts/after-pack.cjs
electronDist: node_modules/electron/dist
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - THIRD_PARTY_NOTICES.md
  # Transformers.js Node builds use the Node/ORT runtime; exclude web/demo sources and WASM assets from release packages.
  - '!node_modules/@huggingface/transformers/src/**/*'
  - '!node_modules/@huggingface/transformers/types/**/*'
  - '!node_modules/@huggingface/transformers/dist/transformers.js'
  - '!node_modules/@huggingface/transformers/dist/transformers.min.js'
  - '!node_modules/@huggingface/transformers/dist/transformers.web.js'
  - '!node_modules/@huggingface/transformers/dist/transformers.web.min.js'
  - '!node_modules/@huggingface/transformers/dist/ort-wasm-*'
  - '!node_modules/onnxruntime-web/dist/*.wasm'
  - '!node_modules/onnxruntime-web/dist/*.map'
  - '!node_modules/onnxruntime-web/dist/ort.js'
  - '!node_modules/onnxruntime-web/dist/ort.mjs'
  - '!node_modules/onnxruntime-web/dist/ort.all.js'
  - '!node_modules/onnxruntime-web/dist/ort.all.mjs'
  - '!node_modules/onnxruntime-web/dist/ort.webgl.js'
  - '!node_modules/onnxruntime-web/dist/ort.webgl.mjs'
  - '!node_modules/onnxruntime-web/dist/ort.webgpu.js'
  - '!node_modules/onnxruntime-web/dist/ort.webgpu.mjs'
  - '!node_modules/onnxruntime-web/dist/ort.jspi.js'
  - '!node_modules/onnxruntime-web/dist/ort.jspi.mjs'
  - '!node_modules/onnxruntime-web/dist/ort.wasm.js'
  - '!node_modules/onnxruntime-web/dist/ort.wasm.mjs'
  # First public release targets Windows x64 CPU only; exclude other OS/arch and GPU runtime binaries.
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**/*'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**/*'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll'
extraResources:
  # Runtime copies used by BrowserWindow on packaged builds.
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: models/bge-small-zh-onnx
    to: models/bge-small-zh-onnx
    filter:
      - model.onnx
      - config.json
      - tokenizer.json
      - tokenizer_config.json
      - special_tokens_map.json
      - vocab.txt
asarUnpack:
  - node_modules/onnxruntime-node/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: Penpal
  # Metadata is written by scripts/after-pack.cjs with the vendored rcedit binary.
  # This avoids electron-builder's winCodeSign archive, which requires Windows symlink privileges.
  signExecutable: false
  fileAssociations:
    - ext: md
      name: Markdown Document
      description: Markdown document
    - ext: txt
      name: Text Document
      description: Plain text document
    - ext: csv
      name: CSV Document
      description: CSV text document
    - ext: doc
      name: Word 97-2003 Document
      description: Word 97-2003 document
    - ext: docx
      name: Word Document
      description: Word document
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 笔伴
